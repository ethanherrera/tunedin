name: Deploy Development Database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type deploy-development to apply pending migrations to tunedin-dev.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tunedin-development-database
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    if: inputs.confirm == 'deploy-development'
    name: Verify and deploy Development migrations
    runs-on: ubuntu-latest
    environment:
      name: Development
    steps:
      - name: Check out the explicitly requested branch commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Verify the disposable backend
        run: make backend-verify

      - name: Show Development migration plan
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: ./scripts/development-database.sh plan

      - name: Apply Development migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: ./scripts/development-database.sh apply

      - name: Record deployed revision
        run: |
          {
            echo '## Development database deployment'
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo '- Scope: forward-only Supabase database migrations only'
            echo '- Hosted seed data, Supabase configuration, and Edge Functions were not changed.'
          } >> "$GITHUB_STEP_SUMMARY"
