name: Promote Staging

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type promote-staging to deploy the selected main commit to Staging.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tunedin-staging-promotion
  cancel-in-progress: false

jobs:
  verify-backend:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'promote-staging'
    name: Verify backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@v7

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify deterministic Edge Function fixtures
        run: make functions-test

      - name: Verify disposable schema, authorization, and Storage
        run: make backend-verify

      - name: Exercise the authenticated Local fixture gateway
        run: make local-catalog-verify

      - name: Stop Local catalog processes
        if: always()
        run: make local-catalog-stop

  verify-ios:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'promote-staging'
    name: Verify iOS
    runs-on: macos-26
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@v7

      - name: Install project tooling
        run: brew install actionlint xcodegen swiftformat swiftlint

      - name: Create non-secret build configuration
        run: make configure

      - name: Verify generated project is current
        run: |
          make generate
          git diff --exit-code -- tunedIn.xcodeproj

      - name: Lint
        run: make lint

      - name: Validate workflows
        run: make workflow-lint

      - name: Validate App Store metadata
        run: make distribution-metadata-verify

      - name: Test Staging authentication and signing controls
        run: make staging-auth-test staging-apple-sign-in-test staging-ipa-signing-test

      - name: Test Development configuration
        run: make test DESTINATION='platform=iOS Simulator,name=iPhone 17'

      - name: Build Staging release configuration
        run: make build-staging DESTINATION='platform=iOS Simulator,name=iPhone 17'

  promote:
    name: Promote backend and TestFlight app
    needs: [verify-backend, verify-ios]
    runs-on: macos-26
    environment:
      name: Staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
      POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
      POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
      APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM }}
      APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
      GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
      GOOGLE_REVERSED_CLIENT_ID: ${{ vars.GOOGLE_REVERSED_CLIENT_ID }}
      GOOGLE_SERVER_CLIENT_SECRET: ${{ secrets.GOOGLE_SERVER_CLIENT_SECRET }}
      TUNEDIN_PROMOTION_ENVIRONMENT: Staging
      MUSICBRAINZ_USER_AGENT: ${{ vars.MUSICBRAINZ_USER_AGENT }}
      TICKETMASTER_DISCOVERY_API_KEY: ${{ secrets.TICKETMASTER_DISCOVERY_API_KEY }}
    steps:
      - name: Check out the verified main commit
        uses: actions/checkout@v7

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install project and PostHog tooling
        run: |
          brew install xcodegen
          npm install --global @posthog/cli@0.8.1

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Validate protected environment configuration
        shell: bash
        run: |
          set -euo pipefail
          required_values=(
            SUPABASE_ACCESS_TOKEN
            SUPABASE_DB_PASSWORD
            SUPABASE_PROJECT_REF
            SUPABASE_PUBLISHABLE_KEY
            POSTHOG_PROJECT_TOKEN
            POSTHOG_PERSONAL_API_KEY
            POSTHOG_CLI_API_KEY
            POSTHOG_PROJECT_ID
            APPLE_DEVELOPMENT_TEAM
            APP_STORE_CONNECT_KEY_ID
            APP_STORE_CONNECT_ISSUER_ID
            APP_STORE_CONNECT_PRIVATE_KEY
            GOOGLE_IOS_CLIENT_ID
            GOOGLE_SERVER_CLIENT_ID
            GOOGLE_REVERSED_CLIENT_ID
            GOOGLE_SERVER_CLIENT_SECRET
            MUSICBRAINZ_USER_AGENT
            TICKETMASTER_DISCOVERY_API_KEY
          )
          for name in "${required_values[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              printf 'Missing required Staging environment value: %s\n' "$name" >&2
              exit 1
            fi
          done
          if [[ "$POSTHOG_PROJECT_ID" != "507318" ]]; then
            printf 'POSTHOG_PROJECT_ID must be the approved Staging project 507318.\n' >&2
            exit 1
          fi

      - name: Validate protected MusicBrainz runtime configuration
        run: deno run --allow-env=MUSICBRAINZ_USER_AGENT scripts/validate-musicbrainz-runtime.ts Staging

      - name: Create ephemeral Staging app configuration
        shell: bash
        run: |
          set -euo pipefail
          make configure
          TUNEDIN_GIT_SHA="$GITHUB_SHA" \
            ./scripts/write-staging-xcconfig.sh ios/Config/Staging.xcconfig

      - name: Validate and plan PostHog Staging
        run: |
          make posthog-test
          make posthog-plan

      - name: Plan Staging native Auth
        run: make staging-auth-plan

      - name: Prepare App Store Connect authentication
        shell: bash
        run: |
          set -euo pipefail
          key_directory="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_directory"
          chmod 700 "$key_directory"
          key_path="$key_directory/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          printf 'APP_STORE_CONNECT_KEY_PATH=%s\n' "$key_path" >> "$GITHUB_ENV"

      - name: Plan Staging Apple Sign In App ID
        run: make staging-apple-sign-in-plan

      - name: Generate the Xcode project
        run: make generate

      - name: Archive the Staging release before backend mutation
        shell: bash
        run: |
          set -euo pipefail
          build_number="$((1000 + GITHUB_RUN_NUMBER)).${GITHUB_RUN_ATTEMPT}"
          printf 'TUNEDIN_BUILD_NUMBER=%s\n' "$build_number" >> "$GITHUB_ENV"
          mkdir -p build
          xcodebuild \
            -project tunedIn.xcodeproj \
            -scheme tunedIn-Staging \
            -configuration Staging \
            -destination 'generic/platform=iOS' \
            -archivePath build/tunedIn-Staging.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_DEVELOPMENT_TEAM" \
            CURRENT_PROJECT_VERSION="$build_number" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive
          archived_app='build/tunedIn-Staging.xcarchive/Products/Applications/tunedIn.app'
          codesign \
            --force \
            --deep \
            --sign - \
            --entitlements ios/tunedIn/Resources/tunedIn-Staging.entitlements \
            --generate-entitlement-der \
            "$archived_app"
          marketing_version="$(/usr/libexec/PlistBuddy \
            -c 'Print :ApplicationProperties:CFBundleShortVersionString' \
            build/tunedIn-Staging.xcarchive/Info.plist)"
          printf 'TUNEDIN_MARKETING_VERSION=%s\n' "$marketing_version" >> "$GITHUB_ENV"

      - name: Verify archived Staging configuration
        run: ./scripts/verify-staging-archive-configuration.sh

      - name: Reconcile and verify Staging Apple Sign In App ID
        run: ./scripts/staging-apple-sign-in.sh apply

      - name: Export and verify the signed Staging IPA
        shell: bash
        run: |
          set -euo pipefail
          export_options="$RUNNER_TEMP/StagingExportOptions.plist"
          cat > "$export_options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_DEVELOPMENT_TEAM}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          mkdir -p build/StagingExport
          xcodebuild \
            -exportArchive \
            -archivePath build/tunedIn-Staging.xcarchive \
            -exportPath build/StagingExport \
            -exportOptionsPlist "$export_options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          ./scripts/verify-staging-ipa-signing.sh build/StagingExport/tunedIn.ipa

      - name: Apply and verify the PostHog Staging contract
        env:
          POSTHOG_CONFIRM_APPLY: staging-507318
        run: make posthog-apply

      - name: Upload Staging dSYMs to PostHog
        shell: bash
        env:
          POSTHOG_CLI_HOST: https://us.posthog.com
          POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_INCLUDE_SOURCE: "0"
        run: |
          set -euo pipefail
          upload_script="$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path '*/SourcePackages/checkouts/posthog-ios/build-tools/upload-symbols.sh' \
            -print -quit)"
          if [[ -z "$upload_script" ]]; then
            printf 'Could not find the pinned posthog-ios dSYM upload script.\n' >&2
            exit 1
          fi
          DWARF_DSYM_FOLDER_PATH="$PWD/build/tunedIn-Staging.xcarchive/dSYMs" \
          DWARF_DSYM_FILE_NAME="tunedIn.app.dSYM" \
          PRODUCT_BUNDLE_IDENTIFIER="com.ethanherrera.tunedin.staging" \
          MARKETING_VERSION="$TUNEDIN_MARKETING_VERSION" \
          CURRENT_PROJECT_VERSION="$TUNEDIN_BUILD_NUMBER" \
            "$upload_script"

      - name: Prepare native Apple and Google Auth
        run: ./scripts/staging-auth.sh prepare

      - name: Show Staging backend migration plan
        run: ./scripts/staging-environment.sh plan

      - name: Apply Staging backend and Edge Functions
        id: promote_backend
        run: ./scripts/staging-environment.sh apply

      - name: Upload the verified Staging IPA to TestFlight
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool \
            --upload-package build/StagingExport/tunedIn.ipa \
            --api-key "$APP_STORE_CONNECT_KEY_ID" \
            --api-issuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Finalize and verify native-only Staging Auth
        run: |
          ./scripts/staging-auth.sh finalize
          make staging-auth-verify

      - name: Record Staging promotion
        shell: bash
        run: |
          {
            printf '## tunedIn Staging promotion\n\n'
            printf -- '- Commit: %c%s%c\n' 96 "$GITHUB_SHA" 96
            printf -- '- Backend: %ctunedin-staging%c migrations\n' 96 96
            printf -- '- Edge Function: %cmusic-catalog%c version %c%s%c (active deployment verified)\n' \
              96 96 96 '${{ steps.promote_backend.outputs.music_catalog_version }}' 96
            printf -- '- Edge Function: %cevent-discovery%c version %c%s%c (active deployment verified)\n' \
              96 96 96 '${{ steps.promote_backend.outputs.event_discovery_version }}' 96
            printf -- '- Edge Function: %cticketmaster-ingestion%c version %c%s%c (active deployment verified)\n' \
              96 96 96 '${{ steps.promote_backend.outputs.ticketmaster_ingestion_version }}' 96
            printf -- '- Observability: PostHog Staging project %c507318%c and uploaded dSYMs\n' 96 96
            printf -- '- Authentication: native Apple and Google; email and phone sign-up disabled\n'
            printf -- '- Apple Sign In: primary App ID and signed distribution profile verified\n'
            printf -- '- App: %ctunedIn Staging%c (%ccom.ethanherrera.tunedin.staging%c)\n' 96 96 96 96
            printf -- '- Version: %c%s%c\n' 96 "$TUNEDIN_MARKETING_VERSION" 96
            printf -- '- Build: %c%s%c\n' 96 "$TUNEDIN_BUILD_NUMBER" 96
            printf -- '- Data copied between environments: no\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove ephemeral credentials and configuration
        if: always()
        shell: bash
        run: |
          rm -f "${APP_STORE_CONNECT_KEY_PATH:-}" ios/Config/Staging.xcconfig
