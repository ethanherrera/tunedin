name: tunedIn

options:
  bundleIdPrefix: com.ethanherrera
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true

configs:
  Local: debug
  Development: debug
  Staging: release
  Production: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: "9.2.0"
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    from: "3.64.6"
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: "2.0.0"

targets:
  tunedIn:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ios/tunedIn/Sources
      - path: ios/tunedIn/Resources
        excludes:
          - Info.plist
    configFiles:
      Local: ios/Config/Local.xcconfig
      Development: ios/Config/Development.xcconfig
      Staging: ios/Config/Staging.xcconfig
      Production: ios/Config/Production.xcconfig
    settings:
      base:
        PRODUCT_NAME: tunedIn
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ios/tunedIn/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
      configs:
        Staging:
          CODE_SIGN_ENTITLEMENTS: ios/tunedIn/Resources/tunedIn-Staging.entitlements
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: PostHog
        product: PostHog
      - package: Supabase
        product: Supabase

  tunedInTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ios/tunedIn/Tests
    dependencies:
      - target: tunedIn
    configFiles:
      Local: ios/Config/Local.xcconfig
      Development: ios/Config/Development.xcconfig
      Staging: ios/Config/Staging.xcconfig
      Production: ios/Config/Production.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethanherrera.tunedin.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  tunedIn-Local:
    build:
      targets:
        tunedIn: all
        tunedInTests: [test]
    run:
      config: Local
    test:
      config: Local
      targets:
        - tunedInTests

  tunedIn-Development:
    build:
      targets:
        tunedIn: all
        tunedInTests: [test]
    run:
      config: Development
    test:
      config: Development
      targets:
        - tunedInTests

  tunedIn-Staging:
    build:
      targets:
        tunedIn: all
        tunedInTests: [test]
    run:
      config: Staging
    test:
      config: Staging
      targets:
        - tunedInTests

  tunedIn-Production:
    build:
      targets:
        tunedIn: all
        tunedInTests: [test]
    run:
      config: Production
    test:
      config: Production
      targets:
        - tunedInTests
