included:
  - ios/tunedIn/Sources
  - ios/tunedIn/Tests

excluded:
  - ios/tunedIn.xcodeproj

disabled_rules:
  - trailing_whitespace

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - identical_operands
  - sorted_first_last

line_length:
  warning: 120
  error: 160

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - url
